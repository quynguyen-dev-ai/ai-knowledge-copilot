services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: copilot
      POSTGRES_PASSWORD: copilot
      POSTGRES_DB: copilot
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U copilot"]
      interval: 5s
      retries: 10

  ai:
    build: ./services/ai
    env_file: .env
    environment:
      DATABASE_URL: postgresql://copilot:copilot@postgres:5432/copilot
    ports: ["8000:8000"]
    depends_on:
      postgres: { condition: service_healthy }

  api:
    build: ./apps/api
    env_file: .env
    environment:
      DATABASE_URL: postgresql://copilot:copilot@postgres:5432/copilot?schema=app
      AI_SERVICE_URL: http://ai:8000
      WEB_ORIGIN: http://localhost:3000
    ports: ["4000:4000"]
    depends_on:
      postgres: { condition: service_healthy }
      ai: { condition: service_started }

  web:
    build:
      context: ./apps/web
      args:
        NEXT_PUBLIC_API_URL: http://localhost:4000
    ports: ["3000:3000"]
    depends_on: [api]

volumes:
  pgdata:
